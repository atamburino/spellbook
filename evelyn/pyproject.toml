[project]
name = "evelyn"
version = "0.1.0"
description = "A local-first personal AI assistant 'brain' — agent loop, tool-calling, and memory you own."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "icalendar>=5.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
packages = ["brain", "brain.tools", "client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
